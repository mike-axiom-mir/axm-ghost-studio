name: Integration local regression runner verification

on:
  push:
    branches:
      - integration/local-regression-runner

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete deterministic suite
        run: node tests/run-all.mjs
