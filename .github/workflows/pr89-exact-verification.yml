name: PR89 exact verification

on:
  push:
    branches:
      - gameplay/terminal-retry-guidance-parity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime syntax
        run: node --check game.js
      - name: Run focused retry-guidance regression
        run: node tests/gameplay-terminal-retry-guidance.mjs
      - name: Run remaining gameplay regressions
        if: always()
        run: |
          set -euo pipefail
          for test in tests/gameplay-*.mjs; do
            if [ "$test" = "tests/gameplay-terminal-retry-guidance.mjs" ]; then
              continue
            fi
            echo "RUN $test"
            node "$test"
          done
      - name: Run integration smoke
        if: always()
        run: node tests/integration-smoke.mjs
      - name: Run relevant experience regressions
        if: always()
        run: |
          node tests/experience-feedback.mjs
          node tests/experience-retry-neutral-feedback.mjs
