name: QA PR 91 main regression control

on:
  push:
    branches:
      - qa/pr91-exact-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact accepted main
        uses: actions/checkout@v4
        with:
          ref: ad848bab3645ff1300ff4e95fc10f72115b11bb5
      - name: Record Node version
        run: node --version
      - name: Syntax check runtime
        run: node --check game.js
      - name: Run QA input regression control
        run: node tests/qa-input-regression.mjs
