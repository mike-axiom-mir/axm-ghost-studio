name: QA accepted regression repair verification

on:
  push:
    branches:
      - qa/pr91-exact-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact QA repair
        uses: actions/checkout@v4
        with:
          ref: 36ae300e45e78219e3b8521e2b02a1bedb3e9760
      - name: Record Node version
        run: node --version
      - name: Syntax check runtime
        run: node --check game.js
      - name: Run complete deterministic test inventory
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count + 1))
          done
          echo "Executed $count test files"
