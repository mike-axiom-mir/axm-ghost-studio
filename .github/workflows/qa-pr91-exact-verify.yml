name: QA PR 91 composed verification

on:
  push:
    branches:
      - qa/pr91-exact-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact composed candidate
        uses: actions/checkout@v4
        with:
          ref: b4f789f76ae022f7cb8362dd2d6be4dd0bc4d364
      - name: Record Node version
        run: node --version
      - name: Syntax check runtime
        run: node --check game.js
      - name: Run complete deterministic test inventory
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count + 1))
          done
          echo "Executed $count test files"
