name: PR89 QA exact verification

on:
  push:
    branches:
      - gameplay/terminal-retry-guidance-parity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check game.js
          node --check tests/gameplay-terminal-retry-guidance.mjs
      - name: Run focused retry-guidance regression
        run: node tests/gameplay-terminal-retry-guidance.mjs
      - name: Run Gameplay regressions
        run: |
          set -euo pipefail
          for test in tests/gameplay-*.mjs; do
            echo "RUN $test"
            node "$test"
          done
      - name: Run QA focus-time contract
        run: node tests/qa-focus-time-contract.mjs
      - name: Run Integration smoke
        run: node tests/integration-smoke.mjs
      - name: Run relevant Experience regressions
        run: |
          node tests/experience-feedback.mjs
          node tests/experience-focus-pause-feedback.mjs
          node tests/experience-relay-threshold-cue.mjs
          node tests/experience-retry-neutral-feedback.mjs
